quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/demo

# Dynamic database credentials via Vault/OpenBao
quarkus.datasource.credentials-provider=database
quarkus.vault.url=http://localhost:8200
# Local/dev token auth. In Kubernetes, prefer SA auth with
# quarkus.vault.authentication.kubernetes.role and no client token.
#quarkus.vault.authentication.client-token=${VAULT_CLIENT_TOKEN:}
quarkus.vault.credentials-provider.database.credentials-role=readonly
quarkus.vault.credentials-provider.database.credentials-mount=database

# Kubernetes profile: app authenticates to OpenBao with its ServiceAccount JWT.
%kubernetes.quarkus.datasource.reactive.url=postgresql://postgres.marmot-demo.svc.cluster.local:5432/demo
%kubernetes.quarkus.vault.url=http://openbao.marmot-demo.svc.cluster.local:8200
# Keep it empty to really test the kubernetes auth/role
%kubernetes.quarkus.vault.authentication.client-token=
%kubernetes.quarkus.vault.authentication.kubernetes.auth-mount-path=kubernetes
%kubernetes.quarkus.vault.authentication.kubernetes.role=marmot-app-role

# Keep pool connections younger than the OpenBao lease TTL.
quarkus.datasource.reactive.max-lifetime=30S
# Keep one reactive connection to make credential rotation easy to read in demo.
quarkus.datasource.reactive.idle-timeout=30S
quarkus.datasource.reactive.max-size=1

# Demo display TTL used by UI countdown (must match OpenBao role TTL).
demo.credentials.ttl=30s

# Convenience in local demos.
quarkus.http.cors=true
