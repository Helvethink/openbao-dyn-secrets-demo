---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marmot-app-sa
  namespace: marmot-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marmot-app
  namespace: marmot-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marmot-app
  template:
    metadata:
      labels:
        app: marmot-app
    spec:
      serviceAccountName: marmot-app-sa
      containers:
        - name: marmot-app
          image: marmot-app:kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: kubernetes
            - name: QUARKUS_DATASOURCE_DB_KIND
              value: postgresql
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres.marmot-demo.svc.cluster.local:5432/demo
            - name: QUARKUS_DATASOURCE_CREDENTIALS_PROVIDER
              value: database
            - name: QUARKUS_DATASOURCE_JDBC_MAX_LIFETIME
              value: 30S
            - name: QUARKUS_DATASOURCE_JDBC_MIN_SIZE
              value: "1"
            - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
              value: "1"
            - name: QUARKUS_VAULT_URL
              value: http://openbao.marmot-demo.svc.cluster.local:8200
            - name: QUARKUS_VAULT_AUTHENTICATION_KUBERNETES_ROLE
              value: marmot-app-role
            - name: QUARKUS_VAULT_CREDENTIALS_PROVIDER_DATABASE_CREDENTIALS_ROLE
              value: readonly
            - name: QUARKUS_VAULT_CREDENTIALS_PROVIDER_DATABASE_CREDENTIALS_MOUNT
              value: database
            - name: DEMO_CREDENTIALS_TTL
              value: 40s
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: marmot-app
  namespace: marmot-demo
spec:
  selector:
    app: marmot-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: marmot-app-nodeport
  namespace: marmot-demo
spec:
  type: NodePort
  selector:
    app: marmot-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080